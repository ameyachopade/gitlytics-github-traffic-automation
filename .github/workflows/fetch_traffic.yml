name: Fetch GitHub Traffic

on:
  schedule:
    # 1st, 8th, 15th and 22nd of each month at 17:00 UTC. A 7-day cadence
    # leaves a 7-day safety margin inside GitHub's 14-day retention window
    # (AF2-ACT-06), so one failed or delayed run cannot lose data.
    - cron: '0 17 1,8,15,22 * *'
  workflow_dispatch:

concurrency:
  group: fetch-github-traffic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch and Sync Traffic
        id: sync
        uses: ./
        with:
          traffic_token: ${{ secrets.TRAFFIC_TOKEN }}
          repository: 'all'
          # AF2-ACT-08: keep private repository names/traffic out of the vault.
          # Set to 'true' only if the vault repository is private and you accept
          # that its committed CSVs will contain your private repo names.
          include_private: 'false'

      - name: Report archive result
        if: always()
        shell: bash
        # AF2-ACT-11: never interpolate an expression straight into a `run:`
        # body - GitHub substitutes it into the SCRIPT TEXT before bash sees
        # it, so any shell metacharacter in the value executes on the runner.
        # Pass it through `env:` and quote it instead.
        env:
          VAULT_DIR: ${{ steps.sync.outputs.data_dir }}
          ROWS_CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          echo "Traffic vault directory: ${VAULT_DIR:-<unset>}"
          echo "New rows committed: ${ROWS_CHANGED:-false}"

      # AF2-ACT-13: if the commit/push fails (protected branch, revoked
      # token, ...) the synced CSVs only existed in the runner's ephemeral
      # workspace and were discarded with the job. Keep them as an artifact
      # so the run is recoverable while GitHub still serves the traffic.
      - name: Upload the traffic vault
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitlytics-traffic-vault
          path: data/
          retention-days: 30
          if-no-files-found: ignore
